# GitLab SoT CI for smithy-protovalidate (Python).
# release_approval gates MRs into main (CE substitute for protected environments).

stages: [test]

include:
  - project: "data-platform/infrastructure-base"
    ref: "v0.2.26"
    file: "/ci/templates/workflow-auto-cancel.gitlab-ci.yml"
  - project: "data-platform/infrastructure-base"
    ref: "v0.2.26"
    file: "/ci/templates/release-approval.gitlab-ci.yml"

python_test:
  stage: test
  interruptible: true
  image: python:3.12-alpine
  script:
    - pip install -r requirements.txt
    - python -m unittest discover -s src/test/python -v
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
